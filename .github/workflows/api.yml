# =============================================================================
# GitHub Actions Workflow — API CI/CD
# =============================================================================
# Trigger: Push/PR to main with api/** or workflow changes
# Runner: Self-hosted (Proxmox LXC Runner)
# Target: Proxmox LXC API Server
# =============================================================================

name: API CI/CD

# =============================================================================
# TRIGGERS
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

# =============================================================================
# CONCURRENCY
# =============================================================================
concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ===========================================================================
  # CI JOB — Static Type Checking & Unit Tests
  # Runs on: push and pull_request
  # ===========================================================================
  ci:
    name: CI — Validation
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Type Checking
        working-directory: api
        run: bun run typecheck

      - name: Run Unit Tests
        working-directory: api
        run: bun test

  # ===========================================================================
  # DEPLOY JOB — Production Deployment with Automated Rollback
  # Runs on: push to main only (after CI passes)
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Production Dependencies
        working-directory: api
        run: bun install --frozen-lockfile --production

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.API_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.API_SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.API_SSH_USER || secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.API_SSH_PORT || secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          Host api-server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Backup Current Version
        env:
          DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH || '/opt/finanzas-api/api' }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ssh api-server "
            set -e
            mkdir -p /opt/backups/finanzas-api
            if [ -d '$DEPLOY_PATH' ]; then
              cp -r '$DEPLOY_PATH' '/opt/backups/finanzas-api/finanzas-api-${TIMESTAMP}'
              echo \"✅ Backup created: /opt/backups/finanzas-api/finanzas-api-${TIMESTAMP}\"
            else
              echo \"ℹ️ Target path $DEPLOY_PATH does not exist yet, skipping backup.\"
            fi
          "

      - name: Deploy via SSH (Rsync)
        env:
          DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH || '/opt/finanzas-api/api' }}
        run: |
          ssh api-server "mkdir -p '$DEPLOY_PATH'"
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git*' \
            -e "ssh api-server" \
            ./api/ \
            api-server:"$DEPLOY_PATH"/

      - name: Restart Service
        run: |
          ssh api-server \
            "sudo systemctl reload-or-restart bun-api.service && \
             echo '✅ Service reloaded/restarted successfully'"

      - name: Health Check
        run: |
          sleep 3

          for i in 1 2 3; do
            HTTP_STATUS=$(ssh api-server \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/health" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi

            echo "⚠️ Health check failed (attempt $i, status: $HTTP_STATUS), retrying in 2s..."
            sleep 2
          done

          echo "❌ Health check failed after 3 attempts"
          exit 1

      - name: Rollback on Failure
        if: failure()
        env:
          DEPLOY_PATH: ${{ secrets.API_DEPLOY_PATH || '/opt/finanzas-api/api' }}
        run: |
          echo "🔄 Rolling back to previous version..."

          ssh api-server "
            LATEST_BACKUP=\$(ls -td /opt/backups/finanzas-api/finanzas-api-* 2>/dev/null | head -1)

            if [ -n \"\$LATEST_BACKUP\" ] && [ -d \"\$LATEST_BACKUP\" ]; then
              echo \"Found backup: \$LATEST_BACKUP\"
              rsync -avz --delete --exclude='.env' \"\$LATEST_BACKUP/\" \"$DEPLOY_PATH/\"
              sudo systemctl reload-or-restart bun-api.service || sudo systemctl restart bun-api.service
              echo '✅ Rollback completed successfully'
              exit 1
            else
              echo '❌ No backup found for rollback! Manual operator intervention required.'
              exit 1
            fi
          "
