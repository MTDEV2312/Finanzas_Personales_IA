# =============================================================================
# GitHub Actions Workflow — API CI/CD
# =============================================================================
# Trigger: Push/PR to main with api/** or workflow changes
# Runner: Hybrid (ubuntu-latest for CI, Self-hosted Proxmox LXC for CD)
# Target: Proxmox LXC API Server
# =============================================================================

name: API CI/CD

# =============================================================================
# PERMISSIONS
# =============================================================================
permissions:
  contents: read

# =============================================================================
# TRIGGERS
# =============================================================================
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

# =============================================================================
# CONCURRENCY
# =============================================================================
concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ===========================================================================
  # CI JOB — Static Type Checking & Unit Tests
  # Runs on: push and pull_request
  # ===========================================================================
  ci:
    name: CI — Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Type Checking
        working-directory: api
        run: bun run typecheck

      - name: Run Unit Tests
        working-directory: api
        run: bun test

  # ===========================================================================
  # DEPLOY JOB — Production Deployment with Automated Rollback
  # Runs on: push to main only (after CI passes)
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Production Dependencies
        working-directory: api
        run: bun install --frozen-lockfile --production

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.API_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.API_SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.API_SSH_USER || secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.API_SSH_PORT || secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.API_SSH_KNOWN_HOSTS || secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "✅ Ingested API_SSH_KNOWN_HOSTS secret"
          else
            echo "::warning::API_SSH_KNOWN_HOSTS secret not configured; falling back to dynamic ssh-keyscan"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          Host api-server
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Create Release Directory
        run: |
          RELEASE_DIR="/opt/finanzas-api/releases/$(date +%Y%m%d_%H%M%S)"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          ssh api-server "mkdir -p '$RELEASE_DIR'"
          echo "✅ Created release directory: $RELEASE_DIR"

      - name: Deploy via SSH (Rsync)
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='.git*' \
            -e "ssh api-server" \
            ./api/ \
            api-server:"$RELEASE_DIR"/
          echo "✅ Production build artifacts deployed to $RELEASE_DIR"

      - name: Assert and Link Shared Environment
        run: |
          ssh api-server "
            set -e
            if [ ! -f /opt/finanzas-api/shared/.env ]; then
              echo '❌ Error: /opt/finanzas-api/shared/.env does not exist!' >&2
              exit 1
            fi
            ln -sfn /opt/finanzas-api/shared/.env '$RELEASE_DIR/.env'
            echo '✅ Shared .env linked to release'
          "

      - name: Atomic Cutover & Service Reload
        run: |
          ssh api-server "
            set -e
            ln -sfn '$RELEASE_DIR' /opt/finanzas-api/current
            echo '✅ Atomic pointer cutover completed: /opt/finanzas-api/current -> $RELEASE_DIR'
            sudo systemctl reload-or-restart bun-api.service || sudo systemctl restart bun-api.service
            echo '✅ Service reloaded/restarted successfully'
          "

      - name: Health Check
        run: |
          sleep 3

          for i in 1 2 3; do
            HTTP_STATUS=$(ssh api-server \
              "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:3000/health" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi

            echo "⚠️ Health check failed (attempt $i, status: $HTTP_STATUS), retrying in 2s..."
            sleep 2
          done

          echo "❌ Health check failed after 3 attempts"
          exit 1

      - name: Prune Old Releases
        run: |
          ssh api-server "
            echo '🧹 Pruning old releases (retaining 5 most recent)...'
            ls -dt /opt/finanzas-api/releases/* | tail -n +6 | xargs -r rm -rf
            echo '✅ Release retention pruning completed'
          "

      - name: Rollback on Failure
        if: failure()
        run: |
          echo "🔄 Rolling back to previous release..."

          ssh api-server "
            PREV_RELEASE=\$(ls -dt /opt/finanzas-api/releases/* 2>/dev/null | sed -n '2p')
            if [ -z \"\$PREV_RELEASE\" ]; then
              PREV_RELEASE=\$(ls -dt /opt/finanzas-api/releases/* 2>/dev/null | grep -v -x \"$RELEASE_DIR\" | head -n 1)
            fi

            if [ -n \"\$PREV_RELEASE\" ] && [ -d \"\$PREV_RELEASE\" ]; then
              echo \"Found previous release: \$PREV_RELEASE\"
              ln -sfn \"\$PREV_RELEASE\" /opt/finanzas-api/current
              sudo systemctl reload-or-restart bun-api.service || sudo systemctl restart bun-api.service
              echo '✅ Rollback completed: /opt/finanzas-api/current repointed to \$PREV_RELEASE'
            else
              echo '❌ No previous release found for rollback!'
            fi

            if [ -n \"$RELEASE_DIR\" ] && [ -d \"$RELEASE_DIR\" ]; then
              echo \"Removing failed release directory: $RELEASE_DIR\"
              rm -rf \"$RELEASE_DIR\"
            fi
            exit 1
          "
